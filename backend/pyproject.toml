[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length, not worth the churn. B008: FastAPI's Depends(...) as a
# default argument is the framework's own idiom, not the mutable-default
# footgun this rule exists for.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["I001"]
